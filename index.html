<!-- public/approve-lead.html -->
<!DOCTYPE html>
<html>
<head>
  <title>Approving Lead...</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-2xl shadow-lg max-w-md w-full text-center" id="status">
    <div class="loader border-4 border-indigo-600 border-t-transparent rounded-full w-12 h-12 mx-auto animate-spin"></div>
    <p class="mt-4 text-slate-600">Processing your approval...</p>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (!token) {
      document.getElementById('status').innerHTML = `
        <div class="text-red-500 text-4xl mb-4">❌</div>
        <h2 class="text-xl font-bold">Invalid Link</h2>
        <p class="text-slate-500">Missing approval token.</p>
      `;
    } else {
      fetch('https://ubkgovgoifgpazkapaxi.supabase.co/functions/v1/approve-lead', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          document.getElementById('status').innerHTML = `
            <div class="text-emerald-500 text-4xl mb-4">✅</div>
            <h2 class="text-xl font-bold">Lead Unlocked!</h2>
            <p class="text-slate-600 mt-2">Contact details:</p>
            <div class="bg-gray-50 p-4 rounded-xl mt-2 text-left">
              <p><strong>Name:</strong> ${data.visitor_name}</p>
              <p><strong>Email:</strong> ${data.visitor_email}</p>
              <p><strong>WhatsApp:</strong> ${data.visitor_whatsapp}</p>
            </div>
            <a href="https://wa.me/${data.visitor_whatsapp}" target="_blank" class="mt-4 inline-block bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded-full">Chat Now</a>
          `;
        } else {
          document.getElementById('status').innerHTML = `
            <div class="text-red-500 text-4xl mb-4">❌</div>
            <h2 class="text-xl font-bold">Approval Failed</h2>
            <p class="text-slate-500">${data.error || 'Unknown error'}</p>
          `;
        }
      })
      .catch(err => {
        document.getElementById('status').innerHTML = `
          <div class="text-red-500 text-4xl mb-4">❌</div>
          <h2 class="text-xl font-bold">Error</h2>
          <p class="text-slate-500">${err.message}</p>
        `;
      });
    }
  </script>
</body>
</html>
